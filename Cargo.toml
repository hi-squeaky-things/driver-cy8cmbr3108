[package]
name = "driver_cy8cmbr3108"
version = "0.1.0"
edition = "2021"
authors = ["Daniël <daniel@hi-squeaky-things.nl>"]
description = "A Rust #no-std I2C driver for the CY8CMBR3108 Touch Controller."
license = "MIT"
repository = "https://github.com/hi-squeaky-things/driver-cy8cmbR3108"
keywords = ["no-std", "i2c", "driver", "cy8cmbR3108", "touch"]
categories = ["embedded"]

[dependencies]
crc16 = "0.4.0"
embedded-hal = { version = "1.0.0" }
embedded-hal-async = { version = "1.0.0" }

[dev-dependencies]
esp-backtrace = { version = "0.18.1", features = ["panic-handler", "println", "esp32s3"] }
esp-hal = { version = "1.0.0", features = ["esp32s3", "unstable"] }
esp-println = { version = "0.16.1", features = ["esp32s3", "log-04"] }
esp-rtos = { version = "0.2.0", features = ["embassy", "esp-alloc", "esp32s3", "log-04"] }
esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32s3"] }
embassy-executor = { version = "0.9.0", features = [] }
embassy-time     = "0.5.0"
embassy-sync = "0.7.2"
esp-alloc        = "0.9.0"
embassy-embedded-hal = "0.5.0"
embedded-hal-bus = "0.3.0"
critical-section = "1.2.0"
static_cell      = "2.1.1"

[profile.dev]
opt-level = 1
